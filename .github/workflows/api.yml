name: api

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trackmytracks
          POSTGRES_PASSWORD: trackmytracks
          POSTGRES_DB: trackmytracks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackmytracks"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://trackmytracks:trackmytracks@localhost:5432/trackmytracks_test
      TEST_DATABASE_URL: postgresql+psycopg://trackmytracks:trackmytracks@localhost:5432/trackmytracks_test
      SECRET_KEY: ci-only-secret
      MB_USER_AGENT: TrackmyTracks/ci ( https://github.com/khadijahnaeem/TrackmyTracks )
      LISTENBRAINZ_TOKEN: ci-only-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: flask db upgrade
      - run: flask db check
      - run: pytest
